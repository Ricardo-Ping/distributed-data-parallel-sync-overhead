<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="190" viewBox="0 0 1120 190" role="img" aria-labelledby="title desc">
  <title id="title">E0：MLP-M 模型结构</title>
  <desc id="desc">图像经Flatten处理为784或3072维输入，依次经过Linear、ReLU、Linear、ReLU和最终Linear层，输出10类Logits。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: 'Noto Sans CJK SC', 'Noto Sans CJK JP', sans-serif; fill: #16253a; text-anchor: middle; }
      .layer { fill: #e9f1fa; stroke: #2563a6; stroke-width: 1.6; rx: 9; }
      .activation { fill: #eef7f1; stroke: #268467; stroke-width: 1.6; rx: 9; }
      .arrow { stroke: #475569; stroke-width: 1.8; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="190" fill="white"/>
  <text x="560" y="28" font-size="19" font-weight="bold">E0：MLP-M 模型结构</text>
  <rect class="layer" x="25" y="61" width="160" height="73"/>
  <text x="105" y="89" font-size="18">Flatten</text>
  <text x="105" y="114" font-size="14">784 / 3072维输入</text>
  <line class="arrow" x1="190" y1="97" x2="218" y2="97"/>
  <rect class="layer" x="225" y="61" width="155" height="73"/>
  <text x="302" y="90" font-size="18">Linear</text>
  <text x="302" y="114" font-size="14">d → 1024</text>
  <line class="arrow" x1="385" y1="97" x2="413" y2="97"/>
  <rect class="activation" x="420" y="61" width="125" height="73"/>
  <text x="482" y="103" font-size="18">ReLU</text>
  <line class="arrow" x1="550" y1="97" x2="578" y2="97"/>
  <rect class="layer" x="585" y="61" width="155" height="73"/>
  <text x="662" y="90" font-size="18">Linear</text>
  <text x="662" y="114" font-size="14">1024 → 512</text>
  <line class="arrow" x1="745" y1="97" x2="773" y2="97"/>
  <rect class="activation" x="780" y="61" width="125" height="73"/>
  <text x="842" y="103" font-size="18">ReLU</text>
  <line class="arrow" x1="910" y1="97" x2="938" y2="97"/>
  <rect class="layer" x="945" y="61" width="150" height="73"/>
  <text x="1020" y="89" font-size="18">Linear</text>
  <text x="1020" y="114" font-size="14">512 → 10（Logits）</text>
  <text x="560" y="170" font-size="14">训练：Cross-Entropy Loss；预测：argmax(Logits)。d 表示输入维数。</text>
</svg>
