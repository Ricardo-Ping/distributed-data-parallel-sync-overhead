  <text x="675" y="429" font-size="17">Rank 0：SGD 更新</text>
  <text x="675" y="450" font-size="15">使用相同的平均梯度与动量</text>
  <rect class="dual" x="915" y="406" width="300" height="54" />
  <text x="1065" y="429" font-size="17">Rank 1：SGD 更新</text>
  <text x="1065" y="450" font-size="15">使用相同的平均梯度与动量</text>
  <text x="867" y="478" font-size="14">两份模型执行相同更新；每张卡都保留全部网络层</text>
  <rect class="panel" x="20" y="502" width="1240" height="68" />
  <text x="640" y="529" font-size="17">验证与测试：Rank 0 在 GPU 0 上评估完整验证集或测试集；Rank 1 等待。</text>
  <text x="640" y="554" font-size="15">每轮验证，第20轮后测试一次并保存模型。图示为完整批次，尾批按实际样本数等分。</text>
</svg>
