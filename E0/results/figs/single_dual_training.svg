<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="590" viewBox="0 0 1280 590" role="img" aria-labelledby="title desc">
  <title id="title">单卡与双卡训练流程对照</title>
  <desc id="desc">单卡使用一个完整模型处理256个样本并更新。双卡各用一个完整模型处理128个样本，通过NCCL对梯度求和并平均，再分别执行相同更新。两种配置的验证和测试都由第一个进程在一张卡上完成。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569" />
    </marker>
    <style>
      text { font-family: 'Noto Sans CJK SC', 'Noto Sans CJK JP', sans-serif; fill: #16253a; text-anchor: middle; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .single { fill: #e9f1fa; stroke: #2563a6; stroke-width: 1.5; rx: 8; }
      .dual { fill: #fff3e5; stroke: #c76a13; stroke-width: 1.5; rx: 8; }
      .sync { fill: #eef7f1; stroke: #268467; stroke-width: 1.8; rx: 8; }
      .arrow { fill: none; stroke: #475569; stroke-width: 1.8; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="590" fill="white" />
  <text x="640" y="29" font-size="23" font-weight="bold">单卡与双卡：相同全局批量下的数据并行</text>
  <text x="640" y="56" font-size="16">每次完整更新共256个样本；模型、学习率和训练轮数相同</text>
  <rect class="panel" x="20" y="75" width="435" height="410" />
  <rect class="panel" x="475" y="75" width="785" height="410" />
  <text x="237" y="107" font-size="19" font-weight="bold">单卡：一个进程，一份完整模型</text>
  <rect class="single" x="100" y="132" width="275" height="50" />
  <text x="237" y="163" font-size="17">Global batch：256个样本</text>
  <path class="arrow" d="M237,182 V204" />
  <rect class="single" x="100" y="211" width="275" height="65" />
  <text x="237" y="237" font-size="17">GPU 0：完整模型</text>
  <text x="237" y="261" font-size="16">对256个样本执行前向与反向</text>
  <path class="arrow" d="M237,276 V299" />
  <rect class="single" x="100" y="306" width="275" height="54" />
  <text x="237" y="329" font-size="17">得到本地平均梯度</text>
  <text x="237" y="350" font-size="15">无需跨卡梯度同步</text>
  <path class="arrow" d="M237,360 V399" />
  <rect class="single" x="100" y="406" width="275" height="54" />
  <text x="237" y="439" font-size="17">执行一次 SGD 更新</text>
  <text x="237" y="478" font-size="14">一张卡完成整批计算与参数更新</text>
  <text x="867" y="107" font-size="19" font-weight="bold">双卡：两个进程，各有一份完整模型</text>
  <rect class="dual" x="600" y="132" width="535" height="42" />
  <text x="867" y="160" font-size="17">Global batch = 256：两卡各处理128个样本</text>
  <path class="arrow" d="M760,174 V184 H675 V195" />
  <path class="arrow" d="M975,174 V184 H1065 V195" />
