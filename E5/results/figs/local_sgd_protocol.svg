<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="580" viewBox="0 0 1360 580">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#536479"/></marker>
<style>text{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;fill:#183049;font-size:20px}.title{font-size:28px;font-weight:700}.small{font-size:17px}.box{fill:#eaf1fb;stroke:#2868a7;stroke-width:2}.local{fill:#fff4e8;stroke:#c77929;stroke-width:2}.sync{fill:#edf7f1;stroke:#28886c;stroke-width:2}.line{stroke:#536479;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1360" height="580" fill="white"/>
<text x="680" y="42" text-anchor="middle" class="title">E5：每卡执行 H 次本地 SGD，再平均模型参数</text>
<text x="680" y="80" text-anchor="middle">以 H=4 为例；每卡每步 128 样本；每步都更新参数，各卡 momentum 始终独立</text>
<text x="30" y="151">rank 0 / GPU 0</text><text x="30" y="184" class="small">本地数据与梯度</text>
<rect x="245" y="116" width="205" height="100" rx="10" class="box"/><text x="347" y="152" text-anchor="middle">本地 F/B + SGD</text><text x="347" y="188" text-anchor="middle">更新 1 次</text>
<path d="M450 167 H482" class="line"/>
<rect x="495" y="116" width="205" height="100" rx="10" class="box"/><text x="597" y="152" text-anchor="middle">本地 F/B + SGD</text><text x="597" y="188" text-anchor="middle">更新第 2 次</text>
<path d="M700 167 H732" class="line"/>
<rect x="745" y="116" width="205" height="100" rx="10" class="box"/><text x="847" y="152" text-anchor="middle">本地 F/B + SGD</text><text x="847" y="188" text-anchor="middle">更新第 3 次</text>
<path d="M950 167 H982" class="line"/>
<rect x="995" y="116" width="205" height="100" rx="10" class="box"/><text x="1097" y="152" text-anchor="middle">本地 F/B + SGD</text><text x="1097" y="188" text-anchor="middle">更新第 4 次</text>
<text x="30" y="294">rank 1 / GPU 1</text><text x="30" y="327" class="small">本地数据与梯度</text>
<rect x="245" y="259" width="205" height="100" rx="10" class="local"/><text x="347" y="295" text-anchor="middle">本地 F/B + SGD</text><text x="347" y="331" text-anchor="middle">更新 1 次</text>
<path d="M450 309 H482" class="line"/>
<rect x="495" y="259" width="205" height="100" rx="10" class="local"/><text x="597" y="295" text-anchor="middle">本地 F/B + SGD</text><text x="597" y="331" text-anchor="middle">更新第 2 次</text>
<path d="M700 309 H732" class="line"/>
<rect x="745" y="259" width="205" height="100" rx="10" class="local"/><text x="847" y="295" text-anchor="middle">本地 F/B + SGD</text><text x="847" y="331" text-anchor="middle">更新第 3 次</text>
<path d="M950 309 H982" class="line"/>
<rect x="995" y="259" width="205" height="100" rx="10" class="local"/><text x="1097" y="295" text-anchor="middle">本地 F/B + SGD</text><text x="1097" y="331" text-anchor="middle">更新第 4 次</text>
<path d="M1200 167 H1275 V402 H1097 V416" class="line"/><path d="M1097 359 V416" class="line"/>
<rect x="245" y="426" width="955" height="86" rx="12" class="sync"/>
<text x="722" y="459" text-anchor="middle">一次 NCCL 参数平均：theta_mean = (theta0 + theta1) / 2</text>
<text x="722" y="493" text-anchor="middle">两卡复制相同参数，进入下一轮 H 次本地更新；momentum 不平均、不清空。</text>
<text x="680" y="552" text-anchor="middle" class="small">epoch 末不足 H 步也平均；验证和测试使用共同参数。H 步本地更新不等于累积后只更新一次。</text>
</svg>
