[project]
name = "d1-gradient-sync"
version = "0.1.0"
description = "D1: 数据并行中的计算与通信开销——模型规模、批大小与梯度累积"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "torch>=2.3",
    "torchvision>=0.18",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["Data", "E0", "E1", "E2", "E3", "training_common"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["E0/tests", "E1/tests", "E2/tests", "E3/tests", "E2/single_gpu/tests", "E3/single_gpu/tests"]
pythonpath = ["."]
markers = [
    "fast: 快速测试（约 1-2 分钟）",
    "slow: 慢速测试，训练至收敛，报告数据用",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["**/results"]

[tool.ruff.lint]
select = ["F"]
