<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="510" viewBox="0 0 1400 510">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#536479"/></marker>
<style>text{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;fill:#183049;font-size:20px}.title{font-size:28px;font-weight:700}.small{font-size:17px}.box{fill:#eaf1fb;stroke:#2868a7;stroke-width:2}.quiet{fill:#fff4e8;stroke:#c77929;stroke-width:2}.update{fill:#edf7f1;stroke:#28886c;stroke-width:2}.line{stroke:#536479;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1400" height="510" fill="white"/>
<text x="700" y="40" text-anchor="middle" class="title">E4：同一个累积窗口，只改变梯度同步频率</text>
<text x="700" y="77" text-anchor="middle">以 K=4 为例；每卡每个 micro 128 样本；两种方式都只在窗口末更新一次参数</text>
<text x="30" y="153">every_micro</text><text x="30" y="183" class="small">4 次梯度归约</text>
<rect x="225" y="113" width="200" height="105" rx="10" class="box"/><text x="325" y="151" text-anchor="middle">micro 1：F/B</text><text x="325" y="188" text-anchor="middle">AllReduce</text>
<path d="M425 164 H452" class="line"/>
<rect x="465" y="113" width="200" height="105" rx="10" class="box"/><text x="565" y="151" text-anchor="middle">micro 2：F/B</text><text x="565" y="188" text-anchor="middle">AllReduce</text>
<path d="M665 164 H692" class="line"/>
<rect x="705" y="113" width="200" height="105" rx="10" class="box"/><text x="805" y="151" text-anchor="middle">micro 3：F/B</text><text x="805" y="188" text-anchor="middle">AllReduce</text>
<path d="M905 164 H932" class="line"/>
<rect x="945" y="113" width="200" height="105" rx="10" class="box"/><text x="1045" y="151" text-anchor="middle">micro 4：F/B</text><text x="1045" y="188" text-anchor="middle">AllReduce</text>
<path d="M1145 164 H1172" class="line"/>
<rect x="1185" y="113" width="185" height="105" rx="10" class="update"/><text x="1277" y="151" text-anchor="middle">一次 SGD</text><text x="1277" y="188" text-anchor="middle">清空梯度</text>
<text x="30" y="314">window_end</text><text x="30" y="344" class="small">1 次梯度归约</text>
<rect x="225" y="273" width="200" height="105" rx="10" class="quiet"/><text x="325" y="311" text-anchor="middle">micro 1：F/B</text><text x="325" y="348" text-anchor="middle">no_sync()</text>
<path d="M425 324 H452" class="line"/>
<rect x="465" y="273" width="200" height="105" rx="10" class="quiet"/><text x="565" y="311" text-anchor="middle">micro 2：F/B</text><text x="565" y="348" text-anchor="middle">no_sync()</text>
<path d="M665 324 H692" class="line"/>
<rect x="705" y="273" width="200" height="105" rx="10" class="quiet"/><text x="805" y="311" text-anchor="middle">micro 3：F/B</text><text x="805" y="348" text-anchor="middle">no_sync()</text>
<path d="M905 324 H932" class="line"/>
<rect x="945" y="273" width="200" height="105" rx="10" class="box"/><text x="1045" y="311" text-anchor="middle">micro 4：F/B</text><text x="1045" y="348" text-anchor="middle">AllReduce</text>
<path d="M1145 324 H1172" class="line"/>
<rect x="1185" y="273" width="185" height="105" rx="10" class="update"/><text x="1277" y="311" text-anchor="middle">一次 SGD</text><text x="1277" y="348" text-anchor="middle">清空梯度</text>
<text x="700" y="424" text-anchor="middle">整个窗口内模型参数保持不变；loss 按 micro 实际样本数 / 本 rank 窗口样本数加权。</text>
<text x="700" y="460" text-anchor="middle" class="small">NCCL 归约求和后除以 2；每次发送完整梯度。同 K、同种子匹配样本、全局 batch 和 SGD 更新预算。</text>
<text x="700" y="491" text-anchor="middle" class="small">F/B 表示 forward + backward。no_sync() 同时包含前向与反向；尾窗口按实际 micro 数同步。</text>
</svg>
